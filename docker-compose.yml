version: "3.8"

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-gateway
    user: "root"
    restart: unless-stopped
    command: >
      sh -lc ' mkdir -p /opt/data && (chown -R 0:0 /opt/data || true) && (chmod 755 /opt/data || true) && (test -e /opt/data/.env && chown 0:0 /opt/data/.env || true) && (test -e /opt/data/.env && chmod 644 /opt/data/.env || true) && exec gateway run '
    volumes:
      - hermes-data:/opt/data
    environment:
      - TZ=Africa/Lagos
      - PATH=/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

volumes:
  hermes-data:
